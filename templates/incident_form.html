{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>{{ 'Edit Incident' if incident else 'Create Incident' }}</h1><p class="muted">Use fictional information only.</p></div></div><form class="card form-card wide" method="post"><div class="form-grid"><label>Category<select name="category" required>{% for x in ['Suspicious Activity','Safety Hazard','Property Issue','Medical Assist','Other'] %}<option {% if incident and incident.category==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>Fictional Location<input name="location" maxlength="120" required value="{{ incident.location if incident else '' }}"></label><label>Date / Time<input type="datetime-local" name="incident_date" required value="{{ incident.incident_date if incident else '' }}"></label><label>Priority<select name="priority" required>{% for x in ['Low','Medium','High'] %}<option {% if incident and incident.priority==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>Status<select name="status" required>{% for x in ['Open','In Progress','Resolved'] %}<option {% if incident and incident.status==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label></div><label>Description<textarea name="description" rows="6" maxlength="1000" required>{{ incident.description if incident else '' }}</textarea></label><div class="actions"><button class="button" type="submit">{{ 'Save Changes' if incident else 'Create Incident' }}</button><a class="button secondary" href="{{ url_for('incidents') }}">Cancel</a></div></form>{% endblock %}
