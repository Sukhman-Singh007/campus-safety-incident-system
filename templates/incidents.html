{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Incidents</h1><p class="muted">Search and filter fictional incident records.</p></div><a class="button" href="{{ url_for('create_incident') }}">+ New Incident</a></div><form class="card filters" method="get"><input name="search" value="{{ search }}" placeholder="Search number, location, description"><select name="category"><option value="">All categories</option>{% for x in ['Suspicious Activity','Safety Hazard','Property Issue','Medical Assist','Other'] %}<option {% if category==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><select name="priority"><option value="">All priorities</option>{% for x in ['Low','Medium','High'] %}<option {% if priority==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><select name="status"><option value="">All statuses</option>{% for x in ['Open','In Progress','Resolved'] %}<option {% if status==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><button class="button" type="submit">Filter</button><a class="button secondary" href="{{ url_for('incidents') }}">Clear</a></form><section class="card">{% include '_incident_table.html' %}</section>{% endblock %}
