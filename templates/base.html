<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Campus Safety{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
{% if session.get('user_id') %}<header class="topbar"><a class="brand" href="{{ url_for('home') }}">Campus Safety</a><nav><a href="{{ url_for('home') }}">Dashboard</a><a href="{{ url_for('incidents') }}">Incidents</a><a class="button small" href="{{ url_for('create_incident') }}">+ New Incident</a><a href="{{ url_for('logout') }}">Logout</a></nav></header>{% endif %}
<main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<script src="{{ url_for('static', filename='script.js') }}"></script></body></html>
