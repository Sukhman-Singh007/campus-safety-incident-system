<div class="table-wrap"><table><thead><tr><th>Incident #</th><th>Category</th><th>Location</th><th>Date</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>{% for incident in incidents %}<tr><td><strong>{{ incident.incident_number }}</strong></td><td>{{ incident.category }}</td><td>{{ incident.location }}</td><td>{{ incident.incident_date.replace('T',' ') }}</td><td><span class="badge {{ incident.priority|lower }}">{{ incident.priority }}</span></td><td><span class="badge status">{{ incident.status }}</span></td><td><a href="{{ url_for('incident_detail', incident_id=incident.id) }}">View</a></td></tr>{% else %}<tr><td colspan="7" class="empty">No incidents found.</td></tr>{% endfor %}</tbody></table></div>
